# AI news radar — source and scoring configuration.
# Everything here is data. Add a feed, get a source. No code changes needed.

# ---------------------------------------------------------------------------
# Vendor / lab blogs. These are the spine: they publish the canonical
# announcement pages that social posts merely link to.
# `weight` multiplies the item score. `tier` drives the source badge colour.
# ---------------------------------------------------------------------------
feeds:
  - name: OpenAI
    url: https://openai.com/news/rss.xml
    weight: 2.0
    tier: lab
  # Anthropic publishes no official RSS feed. This is a community mirror that
  # scrapes the newsroom. It has lagged before — if it goes stale, Anthropic
  # launches still arrive via Hacker News, which covers them reliably.
  - name: Anthropic
    url: https://raw.githubusercontent.com/taobojlen/anthropic-rss-feed/main/anthropic_news_rss.xml
    weight: 2.0
    tier: lab
  - name: Google Research
    url: https://research.google/blog/rss/
    weight: 1.8
    tier: lab
  - name: Google DeepMind
    url: https://deepmind.google/blog/rss.xml
    weight: 1.8
    tier: lab
  # ai.meta.com/blog has no feed. Meta's engineering blog does, and it carries
  # the AI research posts (SAM, Llama, PyTorch) that matter here.
  - name: Meta Engineering
    url: https://engineering.fb.com/feed/
    weight: 1.8
    tier: lab
  # Qwen and Mistral ship open weights constantly and both publish a real
  # feed. DeepSeek, Moonshot (Kimi), MiniMax, Z.ai and Alibaba do not publish
  # any usable RSS — they are covered by the hf_models block instead.
  - name: Qwen
    url: https://qwenlm.github.io/blog/index.xml
    weight: 2.0
    tier: lab
  - name: Mistral
    url: https://mistral.ai/rss.xml
    weight: 2.0
    tier: lab
  - name: Hugging Face
    url: https://huggingface.co/blog/feed.xml
    weight: 1.5
    tier: platform
  - name: NVIDIA AI
    url: https://blogs.nvidia.com/feed/
    weight: 1.3
    tier: platform
  - name: AWS Machine Learning
    url: https://aws.amazon.com/blogs/machine-learning/feed/
    weight: 1.2
    tier: cloud
  - name: Microsoft Research
    url: https://www.microsoft.com/en-us/research/feed/
    weight: 1.4
    tier: lab
  - name: Azure AI
    url: https://azure.microsoft.com/en-us/blog/feed/
    weight: 1.2
    tier: cloud
  # Mistral and Cohere publish no working feed as of this writing. Their
  # launches still land through Hacker News. Run `python3 collect.py
  # --check-feeds` periodically — vendor feeds rot constantly.
  - name: BAIR Berkeley
    url: https://bair.berkeley.edu/blog/feed.xml
    weight: 1.2
    tier: academic
  - name: Sebastian Raschka
    url: https://magazine.sebastianraschka.com/feed
    weight: 1.3
    tier: writer
  - name: Simon Willison
    url: https://simonwillison.net/atom/everything/
    weight: 1.3
    tier: writer

  # --- practitioners: evals, agents, RAG, inference. These carry the
  # implementation detail the vendor blogs leave out. All verified live.
  - name: Interconnects
    url: https://www.interconnects.ai/feed
    weight: 1.5
    tier: writer
  - name: Latent Space
    url: https://www.latent.space/feed
    weight: 1.4
    tier: writer
  - name: Import AI
    url: https://importai.substack.com/feed
    weight: 1.4
    tier: writer
