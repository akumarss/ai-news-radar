  # all have working feeds but have stopped publishing — left out rather than
  # padding --check-feeds with permanent "stale" warnings.

# ---------------------------------------------------------------------------
# Hacker News via the Algolia API. Free, no auth, no key.
# Terms are quoted so Algolia does exact phrase matching — without quotes its
# typo tolerance matches "LLM" against "limiting" and the feed fills with junk.
# ---------------------------------------------------------------------------
hackernews:
  enabled: true
  weight: 1.4
  # 25 proved too strict in practice — it yielded only a handful of items a
  # day. 12 gives useful volume without dragging in unranked noise.
  min_points: 12
  queries:
    - '"LLM"'
    - '"GenAI"'
    - '"generative AI"'
    - '"machine learning"'
    - '"fine-tuning"'
    - '"RAG"'
    - '"AI agent"'
    - '"transformer model"'
    # Launch posts often avoid the older vocabulary above: the Muse Glimmer
    # release (424 pts) was titled "open weights 30B local coding model" and
    # matched none of them. Quoted phrases are exact, so '"AI agent"' does
    # not catch "local agents".
    - '"agentic"'
    - '"open-weight"'
    - '"LangChain"'
    - '"vLLM"'
    - '"evals"'
    - '"MCP"'
    - '"context engineering"'
    - '"inference"'

# ---------------------------------------------------------------------------
# Hugging Face model releases. Free, no auth. This is the primary signal for
# open-weight launches: the labs below upload weights before (or instead of)
# writing a blog post, and several publish no feed at all.
# ---------------------------------------------------------------------------
hf_models:
  enabled: true
  weight: 2.2
  # Likes accumulate within hours on a real launch and filter out the
  # long tail of checkpoints, quantisations and staging repos.
  min_likes: 30
  limit: 30
  max_age_days: 90
  authors:
    - deepseek-ai
    - Qwen
    - moonshotai
    - MiniMaxAI
    - zai-org
    - meta-llama
    - mistralai
    - openai
    - google
    - Alibaba-NLP
    - ByteDance-Seed
    - internlm
    - tencent
    - baidu
    - allenai
    - ibm-granite
    - LiquidAI
    - nvidia
    - microsoft

# ---------------------------------------------------------------------------
# GitHub releases. Free, no auth. The only reliable signal for the agent and
# eval frameworks: LangChain's blog feed returns 200 with zero entries, and
# Langfuse / LlamaIndex publish no feed at all. Release titles are bare
# version strings, so each repo carries a label and blurb.
# ---------------------------------------------------------------------------
gh_releases:
  enabled: true
  weight: 1.2
  # Only the newest few per repo — some projects tag several times a day.
  per_repo: 4
  max_age_days: 90
  repos:
    - repo: langchain-ai/langchain
      label: LangChain
      blurb: LLM application framework
    - repo: langchain-ai/langgraph
      label: LangGraph
      blurb: stateful agent orchestration
    - repo: langfuse/langfuse
      label: Langfuse
      blurb: LLM observability and tracing
    - repo: run-llama/llama_index
      label: LlamaIndex
      blurb: RAG and data framework
    - repo: stanfordnlp/dspy
      label: DSPy
      blurb: declarative LLM programming
    - repo: pydantic/pydantic-ai
      label: Pydantic AI
      blurb: typed agent framework
    - repo: vllm-project/vllm
      label: vLLM
      blurb: high-throughput inference serving
    - repo: sgl-project/sglang
      label: SGLang
      blurb: fast LLM serving runtime
    - repo: ollama/ollama
      label: Ollama
      blurb: local model runner
    - repo: huggingface/transformers
      label: Transformers
      blurb: model library
    - repo: huggingface/trl
      label: TRL
      blurb: RLHF and post-training
    - repo: unslothai/unsloth
      label: Unsloth
      blurb: fast fine-tuning
    - repo: confident-ai/deepeval
      label: DeepEval
      blurb: LLM evaluation framework
    - repo: promptfoo/promptfoo
      label: Promptfoo
      blurb: prompt and eval testing
    - repo: explodinggradients/ragas
      label: Ragas
      blurb: RAG evaluation
    - repo: modelcontextprotocol/servers
      label: MCP Servers
      blurb: Model Context Protocol
    - repo: dbt-labs/dbt-core
      label: dbt
      blurb: analytics engineering
    - repo: feast-dev/feast
      label: Feast
      blurb: feature store
    - repo: duckdb/duckdb
      label: DuckDB
      blurb: analytical database
  # ggml-org/llama.cpp is deliberately absent: it tags build numbers
  # ("b10344") several times a day, which would swamp everything else.

# ---------------------------------------------------------------------------
# arXiv. Free, no auth. Categories rather than keywords — cleaner signal.
# ---------------------------------------------------------------------------
arxiv:
  enabled: true
  weight: 1.0
  max_results: 60
  categories:
    - cs.CL
    - cs.LG
    - cs.AI

# ---------------------------------------------------------------------------
# Reddit. Free for non-commercial use at 100 QPM, but needs an OAuth app.
# Skipped silently when REDDIT_CLIENT_ID / REDDIT_CLIENT_SECRET are unset.
# ---------------------------------------------------------------------------
reddit:
  enabled: true
  weight: 1.2
  min_score: 40
  listing: top
  timeframe: day
  limit: 25
  subreddits:
    - LocalLLaMA
    - MachineLearning
    - singularity
    - OpenAI
    - StableDiffusion

# ---------------------------------------------------------------------------
# Bluesky. Free and unlimited on public data, but searchPosts needs a session.
# Skipped silently when BLUESKY_HANDLE / BLUESKY_APP_PASSWORD are unset.
# Create an app password at Settings -> App Passwords (never your real one).
# ---------------------------------------------------------------------------
bluesky:
  enabled: true
  weight: 0.9
  # Topic queries pull from the whole network, so they need a real like
  # threshold to stay clean. Handles are curated, so they don't.
  min_likes: 25
  handle_min_likes: 3
  limit: 40
  queries:
    - LLM
    - "open source AI"
    - GenAI
    - "AI research"
    - '"open weights"'
    - '"open-weight"'
    - Qwen
    - DeepSeek
    - vLLM
    - MCP
    - LangGraph
    - evals
  # Verified live via app.bsky.actor.getProfile — follower and post counts
  # checked, dead and dormant accounts left out. Posts without an outbound
  # link are dropped by the fetcher, so these yield "here's a thing worth
  # reading" links rather than chatter.
  handles:
    - natolambert.bsky.social      # open models, post-training (Interconnects)
    - rasbt.bsky.social            # LLM training and architecture
    - thomwolf.bsky.social         # Hugging Face cofounder
    - danielvanstrien.bsky.social  # Hugging Face, datasets
    - swyx.io                      # Latent Space, AI engineering
    - eugeneyan.com                # applied ML, evals, RAG
    - simonwillison.net            # LLM tooling, daily
    - vickiboykis.com              # ML engineering, embeddings
    - karpathy.bsky.social         # rare, but worth catching
    - togelius.bsky.social         # research
    - yoshuabengio.bsky.social     # research, safety
    - mmitchell.bsky.social        # ethics and policy
  # Skipped: hf.co, lilianweng, percyliang, sarahookr, timnitgebru and
  # paperswithcode do not exist on Bluesky; hamelhusain and clem.hf.co exist
  # but have posted a handful of times. arxiv-cs-cl posts every cs.CL paper
  # (44k posts) — arXiv is already a first-class source, so it would only
  # duplicate at volume.

