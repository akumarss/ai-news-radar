# Terms that reliably indicate the item is about markets, not technology.
exclude:
  - stock price
  - share price
  - earnings call
  - IPO
  - crypto
  - bitcoin
  - NFT

scoring:
  # Half-life in hours for the recency decay curve.
  half_life_hours: 36
  # Keyword hits in the title count for more than hits in the summary.
  title_keyword_bonus: 3.0
  summary_keyword_bonus: 0.8
  # Each additional independent source corroborating an item.
  corroboration_bonus: 4.0
  # Open-weight launches are the point of this feed, so items tagged
  # `releases` get a flat bump on top of their keyword relevance.
  release_bonus: 6.0
  # Cap engagement's contribution so one viral post can't dominate the page.
  max_engagement_points: 12.0

output:
  # The page is an archive you scroll back through, not a snapshot,
  # so these are deep. ~3000 items lands around 3MB of JSON.
  max_items: 3000
  retention_days: 90
