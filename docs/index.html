<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AI news radar</title>
<meta name="description" content="Open-weight model releases and AI news from labs, Hugging Face, GitHub, Hacker News, arXiv and Bluesky." />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#128225;</text></svg>" />
<style>
  :root {
    --bg: #fbfbfa; --surface: #ffffff; --surface-2: #f4f4f2;
    --text: #161614; --text-2: #5f5e59; --text-3: #8a8983;
    --border: #e6e5e0; --border-2: #d2d1ca;
    --accent: #2a6fd6; --accent-bg: #eaf1fc;
    --new: #1a7f52; --new-bg: #e5f4ec;
    --hot: #b3541e; --hot-bg: #fbeee5;
    --rel: #7a3fb8; --rel-bg: #f2ebfa;
    --max: 1500px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161614; --surface: #1e1e1b; --surface-2: #262622;
      --text: #f0efe9; --text-2: #b3b1a7; --text-3: #85847d;
      --border: #32312c; --border-2: #45443d;
      --accent: #6ba4ee; --accent-bg: #1c2c42;
      --new: #5cc48e; --new-bg: #163024;
      --hot: #e0915f; --hot-bg: #33231a;
      --rel: #bd9bea; --rel-bg: #2a2038;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 400 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column;
  }
  a { color: inherit; }
  .wrap { max-width: var(--max); margin: 0 auto; width: 100%; padding: 0 16px; }

  header { border-bottom: 1px solid var(--border); background: var(--surface); flex: none; }
  .head-inner { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; padding: 13px 0 9px; }
  h1 { font-size: 17px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
  .stamp { margin-left: auto; color: var(--text-3); font-size: 12px; font-variant-numeric: tabular-nums; }

  .controls { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; padding-bottom: 9px; }
  .toggle {
    font: inherit; font-size: 13px; font-weight: 500; cursor: pointer;
    background: none; border: 1px solid var(--border-2); border-radius: 7px;
    color: var(--text-2); padding: 5px 11px;
  }
  .toggle:hover { background: var(--surface-2); color: var(--text); }
  .toggle[aria-pressed="true"] { background: var(--accent-bg); color: var(--accent); border-color: var(--accent); }
  input[type="search"] {
    font: inherit; font-size: 13px; padding: 5px 10px; min-width: 200px; flex: 1; max-width: 340px;
    background: var(--bg); color: var(--text);
    border: 1px solid var(--border-2); border-radius: 7px;
  }
  input[type="search"]:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .clear { font: inherit; font-size: 12px; background: none; border: none; color: var(--text-3); cursor: pointer; text-decoration: underline; }
  .clear:hover { color: var(--text); }

  /* One shared chip row — the tags filter both columns at once. */
  .chips { display: flex; gap: 5px; flex-wrap: wrap; padding: 0 0 10px; }
  .chip {
    font: inherit; font-size: 12px; cursor: pointer; padding: 3px 9px;
    background: var(--surface-2); color: var(--text-2);
    border: 1px solid var(--border); border-radius: 999px;
  }
  .chip:hover { border-color: var(--border-2); color: var(--text); }
  .chip[aria-pressed="true"] { background: var(--accent-bg); border-color: var(--accent); color: var(--accent); }
  .chip .n { color: var(--text-3); margin-left: 5px; font-variant-numeric: tabular-nums; }
  .chip[aria-pressed="true"] .n { color: inherit; opacity: .7; }

  /* Two panes, each scrolling on its own so one column doesn't drag the other. */
  .panes {
    flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr;
    gap: 0; max-width: var(--max); margin: 0 auto; width: 100%;
  }
  .pane { min-height: 0; display: flex; flex-direction: column; border-left: 1px solid var(--border); }
  .pane:first-child { border-left: none; }
  .pane-head {
    flex: none; padding: 9px 16px; border-bottom: 1px solid var(--border);
    background: var(--surface); display: flex; align-items: baseline; gap: 9px;
  }
  .pane-head h2 { margin: 0; font-size: 13px; font-weight: 600; letter-spacing: .02em; text-transform: uppercase; }
  .pane-head .why { font-size: 12px; color: var(--text-3); font-weight: 400; }
  .pane-head .count { margin-left: auto; font-size: 12px; color: var(--text-3); font-variant-numeric: tabular-nums; }
  .pane-body { overflow-y: auto; overscroll-behavior: contain; padding: 0 16px; }

  ol.feed { list-style: none; margin: 0; padding: 4px 0 0; }
  li.item {
    display: grid; grid-template-columns: 28px 1fr; gap: 9px;
    padding: 8px 0; border-bottom: 1px solid var(--border);
  }
  li.item.read { opacity: .45; }
  .rank { color: var(--text-3); font-size: 12px; text-align: right; font-variant-numeric: tabular-nums; padding-top: 2px; }
  .title { font-size: 14px; font-weight: 500; text-decoration: none; line-height: 1.4; }
  .title:hover { color: var(--accent); text-decoration: underline; }
  .title:visited { color: var(--text-2); }
  .dom { color: var(--text-3); font-size: 11px; margin-left: 5px; }
  .meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 3px; font-size: 11px; color: var(--text-2); }
  .badge { font-size: 10px; padding: 1px 5px; border-radius: 4px; white-space: nowrap; }
  .badge.new { background: var(--new-bg); color: var(--new); }
  .badge.hot { background: var(--hot-bg); color: var(--hot); }
  .badge.rel { background: var(--rel-bg); color: var(--rel); font-weight: 500; }
  .badge.multi { background: var(--accent-bg); color: var(--accent); }
  .badge.topic { background: var(--surface-2); color: var(--text-3); }
  .mark { font: inherit; font-size: 10px; cursor: pointer; background: none; border: none; color: var(--text-3); padding: 0; text-decoration: underline; }
  .mark:hover { color: var(--text); }
  .empty, .end { text-align: center; color: var(--text-3); font-size: 12px; padding: 26px 12px; }
  .sentinel { height: 1px; }

  /* Stack the panes on a narrow screen; side-by-side needs the width. */
  @media (max-width: 820px) {
    body { height: auto; }
    .panes { grid-template-columns: 1fr; max-width: 640px; }
    .pane { border-left: none; border-top: 1px solid var(--border); }
    .pane-body { overflow: visible; max-height: none; }
    .pane-head { position: sticky; top: 0; z-index: 5; }
  }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="head-inner">
      <h1>AI news radar</h1>
      <span class="stamp" id="stamp"></span>
    </div>
    <div class="controls">
      <input type="search" id="q" placeholder="Search titles, sources…" aria-label="Search" />
      <button class="toggle" id="releases">Releases only</button>
      <button class="toggle" id="unread">Unread only</button>
      <button class="toggle" id="multi">2+ sources</button>
      <button class="clear" id="clear">clear filters</button>
    </div>
    <div class="chips" id="chips"></div>
  </div>
</header>

<div class="panes">
  <section class="pane">
    <div class="pane-head">
      <h2>Hot</h2><span class="why">ranked</span><span class="count" id="count-hot"></span>
    </div>
    <div class="pane-body" id="body-hot">
      <ol class="feed" id="feed-hot"></ol>
      <div class="sentinel" id="sent-hot"></div>
      <div class="end" id="end-hot"></div>
    </div>
  </section>
  <section class="pane">
    <div class="pane-head">
      <h2>Latest</h2><span class="why">newest first</span><span class="count" id="count-latest"></span>
    </div>
    <div class="pane-body" id="body-latest">
      <ol class="feed" id="feed-latest"></ol>
      <div class="sentinel" id="sent-latest"></div>
      <div class="end" id="end-latest"></div>
    </div>
  </section>
</div>

<script>
(function () {
  var PAGE = 40;
  var READ_KEY = "radar.read";
  var PREF_KEY = "radar.prefs";
  var COLS = ["hot", "latest"];

  function load(k, d) { try { return JSON.parse(localStorage.getItem(k)) || d; } catch (e) { return d; } }
  function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

  var read = load(READ_KEY, {});
  var prefs = load(PREF_KEY, {});
  var state = {
    data: null,
    releases: !!prefs.releases,
    unread: !!prefs.unread,
    multi: !!prefs.multi,
    topics: new Set(prefs.topics || []),
    q: "",
    lists: { hot: [], latest: [] },
    shown: { hot: PAGE, latest: PAGE }
  };

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function ago(h) {
    if (h == null) return "";
    if (h < 1) return Math.max(1, Math.round(h * 60)) + "m";
    if (h < 24) return Math.round(h) + "h";
    var d = Math.round(h / 24);
    return d < 31 ? d + "d" : Math.round(d / 30.4) + "mo";
  }
  function persist() {
    save(PREF_KEY, {
      releases: state.releases, unread: state.unread,
      multi: state.multi, topics: Array.from(state.topics)
    });
  }

  fetch("data/items.json?t=" + Date.now())
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (data) { state.data = data; boot(); })
    .catch(function () {
      COLS.forEach(function (c) {
        document.getElementById("feed-" + c).innerHTML =
          '<div class="empty"><strong>No data yet.</strong><br>Run the collector.</div>';
      });
    });

  function boot() {
    var d = state.data;
    document.getElementById("stamp").textContent =
      d.items.length + " stories · updated " + new Date(d.generated_at).toLocaleString();

    buildChips();

    [["releases", "releases"], ["unread", "unread"], ["multi", "multi"]].forEach(function (pair) {
      document.getElementById(pair[0]).addEventListener("click", function () {
        state[pair[1]] = !state[pair[1]]; persist(); render();
      });
    });
    document.getElementById("q").addEventListener("input", function (e) {
      state.q = e.target.value.toLowerCase(); render();
    });
    document.getElementById("clear").addEventListener("click", function () {
      state.releases = state.unread = state.multi = false;
      state.topics.clear(); state.q = "";
      document.getElementById("q").value = "";
      document.querySelectorAll(".chip").forEach(function (c) { c.setAttribute("aria-pressed", "false"); });
      persist(); render();
    });

    // Each pane scrolls independently, so each needs its own observer rooted
    // in that pane — a document-level one would never fire.
    COLS.forEach(function (col) {
      if (!("IntersectionObserver" in window)) return;
      new IntersectionObserver(function (entries) {
        if (entries[0].isIntersecting) more(col);
      }, {
        root: window.innerWidth > 820 ? document.getElementById("body-" + col) : null,
        rootMargin: "500px"
      }).observe(document.getElementById("sent-" + col));
    });

    render();
  }

  function buildChips() {
    var counts = {};
    state.data.items.forEach(function (i) {
      (i.topics || []).forEach(function (t) { counts[t] = (counts[t] || 0) + 1; });
    });
    var names = Object.keys(counts).sort(function (a, b) { return counts[b] - counts[a]; });
    var box = document.getElementById("chips");
    box.innerHTML = names.map(function (t) {
      return '<button class="chip" aria-pressed="' + state.topics.has(t) + '" data-topic="' + esc(t) + '">' +
             esc(t) + '<span class="n">' + counts[t] + "</span></button>";
    }).join("");
    box.addEventListener("click", function (e) {
      var btn = e.target.closest(".chip");
      if (!btn) return;
      var t = btn.dataset.topic;
      if (state.topics.has(t)) state.topics.delete(t); else state.topics.add(t);
      btn.setAttribute("aria-pressed", state.topics.has(t));
      persist(); render();
    });
  }

  function matches(i) {
    if (state.releases && !i.is_release) return false;
    if (state.unread && read[i.id]) return false;
    if (state.multi && i.source_count < 2) return false;
    if (state.topics.size) {
      var hit = (i.topics || []).some(function (t) { return state.topics.has(t); });
      if (!hit) return false;
    }
    if (state.q) {
      var hay = (i.title + " " + i.source + " " + i.summary + " " + i.domain).toLowerCase();
      if (hay.indexOf(state.q) === -1) return false;
    }
    return true;
  }

  function row(i, n) {
    var badges = "";
    if (i.is_release) badges += '<span class="badge rel">release</span>';
    if (i.is_new) badges += '<span class="badge new">new</span>';
    if (i.source_count > 1) badges += '<span class="badge multi">' + i.source_count + "&times;</span>";
    if (i.engagement >= 300) badges += '<span class="badge hot">hot</span>';
    var topics = (i.topics || []).map(function (t) {
      return '<span class="badge topic">' + esc(t) + "</span>";
    }).join("");

    return '<li class="item' + (read[i.id] ? " read" : "") + '">' +
      '<div class="rank">' + n + "</div><div>" +
      '<a class="title" href="' + esc(i.url) + '" target="_blank" rel="noopener noreferrer">' +
        esc(i.title) + "</a><span class=\"dom\">" + esc(i.domain) + "</span>" +
      '<div class="meta">' + badges +
        "<span>" + esc(ago(i.age_hours)) + "</span><span>·</span><span>" + esc(i.source) + "</span>" +
        (i.engagement_label ? "<span>·</span><span>" + esc(i.engagement_label) + "</span>" : "") +
        topics +
        '<button class="mark" data-mark="' + esc(i.id) + '">' +
          (read[i.id] ? "unread" : "read") + "</button>" +
      "</div></div></li>";
  }

  function render() {
    document.getElementById("releases").setAttribute("aria-pressed", state.releases);
    document.getElementById("unread").setAttribute("aria-pressed", state.unread);
    document.getElementById("multi").setAttribute("aria-pressed", state.multi);

    // Filter once, then order the same set two different ways.
    var pool = state.data.items.filter(matches);
    state.lists.hot = pool.slice().sort(function (a, b) { return b.score - a.score; });
    state.lists.latest = pool.slice().sort(function (a, b) {
      return new Date(b.published) - new Date(a.published);
    });
    COLS.forEach(function (c) { state.shown[c] = PAGE; paint(c); });
  }

  function more(col) {
    if (state.shown[col] >= state.lists[col].length) return;
    state.shown[col] += PAGE;
    paint(col);
  }

  function paint(col) {
    var list = state.lists[col];
    var feed = document.getElementById("feed-" + col);
    var slice = list.slice(0, state.shown[col]);

    document.getElementById("count-" + col).textContent =
      list.length ? slice.length + " / " + list.length : "";

    if (!slice.length) {
      feed.innerHTML = '<div class="empty">Nothing matches those filters.</div>';
      document.getElementById("end-" + col).textContent = "";
      return;
    }
    feed.innerHTML = slice.map(function (i, n) { return row(i, n + 1); }).join("");
    feed.querySelectorAll("[data-mark]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var id = btn.dataset.mark;
        if (read[id]) delete read[id]; else read[id] = 1;
        save(READ_KEY, read);
        COLS.forEach(paint);   // the same story can sit in both panes
      });
    });
    document.getElementById("end-" + col).textContent =
      state.shown[col] >= list.length ? "End of " + list.length + " stories." : "Loading more…";
  }
})();
</script>
</body>
</html>
