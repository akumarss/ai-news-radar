name: Update AI news radar

on:
  schedule:
    # Every 30 minutes. Times are UTC and GitHub delays scheduled runs under
    # load — a 30-minute cron in practice lands every 35-50 minutes, and
    # under heavy load GitHub drops runs rather than queueing them. Treat
    # this as "about twice an hour", not a guarantee.
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "**.py"
      - "config.yml"
      - ".github/workflows/update.yml"

# Never let a slow run overlap the next scheduled one.
concurrency:
  group: news-radar
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python test_pipeline.py

      - name: Collect news
        env:
          # Optional. Absent secrets make the relevant source skip itself
          # rather than fail the run.
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USERNAME: ${{ secrets.REDDIT_USERNAME }}
          REDDIT_PASSWORD: ${{ secrets.REDDIT_PASSWORD }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
        run: python collect.py

      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --staged --quiet; then
            echo "No change in feed data."
            exit 0
          fi
          git commit -m "chore: refresh news data [skip ci]"
          # Two runs can be in flight at once (a manual dispatch racing the
          # cron), and both rewrite docs/data wholesale — so a plain rebase
          # hits a content conflict in items.json and the run dies. The file
          # is a full regeneration, never an edit, so there is nothing to
          # merge: this run's copy always wins. Note `-X theirs` is correct
          # and not a typo — during a rebase "theirs" is the commit being
          # replayed, which is ours.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt) — replaying onto origin."
            git fetch origin ${{ github.ref_name }}
            if ! git rebase -X theirs origin/${{ github.ref_name }}; then
              git rebase --abort || true
              echo "Could not replay onto origin."
              exit 1
            fi
          done
          echo "Still could not push after 3 attempts."
          exit 1
